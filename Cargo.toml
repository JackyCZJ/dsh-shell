[package]
name = "dsh-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native desktop shell for the DeepSeek Harness web UI, with hot-reloadable theme"
license = "MIT"
publish = false

[[bin]]
name = "dsh-shell"
path = "src/main.rs"

[dependencies]
# Windowing + native webview (WebKit on macOS, WebView2 on Windows, WebKitGTK on Linux)
tao = "0.37"
wry = "0.57"

# Theme hot reload
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading DSH's own settings.yaml (the shell's config lives there)
serde_norway = "0.9"

# Launching and supervising `dsh web`
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

# Native desktop affordances
tray-icon = "0.25"
global-hotkey = "0.8"
# Native app menu. Predefined items use the platform's own selectors, which is
# what makes Cmd+C/V/X/A route to the focused webview.
muda = "0.20"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Notifications.
#
# macOS gets its own path rather than notify-rust's: that backend still goes
# through `NSUserNotificationCenter`, which Apple deprecated in macOS 11 and
# which no longer delivers on macOS 26 — the call reports success, nothing
# appears, and the app never registers as a notification source at all.
# `UNUserNotificationCenter` is the supported API, and it is what the system's
# Notifications pane lists.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
# For the Dock badge. AppKit already arrives transitively through tao, muda and
# tray-icon; naming the two classes directly avoids enabling its thousand-entry
# default feature set for bindings this crate never touches.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDockTile",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[profile.release]
lto = "thin"
codegen-units = 1
