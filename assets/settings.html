<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DSH Shell Settings</title>
<style>
  /* Shell-owned settings window.
     Uses the same tokens as the boot screen so it matches the shell chrome.
     The form is generated from the live theme, so what is shown is what the
     shell is actually using. */
  :root {
    --bg: #ffffff;
    --surface: #f5f6f7;
    --surface-hover: #e9ebed;
    --border: #d9dcdf;
    --text: #0f1115;
    --muted: #81858c;
    --accent: #4176e6;
    --danger: #d93025;
    --ok: #1a7f37;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { padding: 18px 20px 80px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 12px; }
  section { margin-bottom: 22px; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600; margin: 0 0 10px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 0; border-bottom: .5px solid var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .row label { flex: 0 0 148px; }
  .row .hint { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .grow { flex: 1; min-width: 0; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
  }
  textarea {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    min-height: 92px; resize: vertical;
  }
  input[type=color] {
    width: 34px; height: 26px; padding: 0; border: 1px solid var(--border);
    border-radius: 6px; background: none; cursor: pointer;
  }
  .swatch { display: flex; align-items: center; gap: 8px; }
  .swatch code { font-size: 11px; color: var(--muted); min-width: 62px; }
  .swatch label { flex: 0 0 148px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input[type=number] { width: 76px; }
  .versions { display: flex; gap: 8px; align-items: center; }
  select {
    font: inherit; padding: 5px 8px; border-radius: 6px; min-width: 140px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  #update_status.busy { color: var(--muted); }
  #update_status.ok { color: var(--ok); }
  #update_status.err { color: var(--danger); }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; background: var(--bg);
    border-top: 1px solid var(--border);
  }
  footer .msg { flex: 1; font-size: 12px; }
  footer .msg.ok { color: var(--ok); }
  footer .msg.err { color: var(--danger); }
  button {
    font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1 data-i18n="title">DSH Shell Settings</h1>
  <p class="sub" data-i18n="subtitle"></p>

  <section>
    <h2 data-i18n="keyboard">Keyboard</h2>
    <div class="row">
      <label for="hotkey" data-i18n="summon">Summon shortcut</label>
      <div class="grow">
        <input type="text" id="hotkey" spellcheck="false" placeholder="meta+shift+D">
        <div class="hint" id="hotkey-hint" data-i18n="summonHint"></div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="colours">Colours</h2>
    <details open>
      <summary data-i18n="light">Light</summary>
      <div class="grid" id="light-grid"></div>
    </details>
    <details>
      <summary data-i18n="dark">Dark</summary>
      <div class="grid" id="dark-grid"></div>
    </details>
  </section>

  <section>
    <h2 data-i18n="customCss">Custom CSS</h2>
    <textarea id="custom_css" spellcheck="false"
      placeholder="body { --dsh-content-font-size: 15px; }"></textarea>
    <div class="hint" data-i18n="cssHint"></div>
  </section>

  <section>
    <h2 data-i18n="updates">Updates</h2>
    <div class="row">
      <label for="update_channel" data-i18n="channel">Release channel</label>
      <div class="grow">
        <select id="update_channel">
          <option value="latest" data-i18n="channelLatest"></option>
          <option value="alpha" data-i18n="channelAlpha"></option>
        </select>
        <div class="hint" data-i18n="channelHint"></div>
      </div>
    </div>
    <div class="row">
      <label data-i18n="installed">Installed</label>
      <div class="grow versions">
        <code id="current_version">—</code>
        <span id="update_arrow" hidden>&rarr; <code id="target_version"></code></span>
      </div>
    </div>
    <div class="row">
      <label></label>
      <div class="grow inline">
        <button id="check_update" data-i18n="checkNow">Check Now</button>
        <button id="install_update" class="primary" data-i18n="installUpdate" hidden>Upgrade</button>
      </div>
    </div>
    <div class="hint" id="update_status"></div>
  </section>

  <footer>
    <span class="msg" id="msg"></span>
    <button id="revert" data-i18n="revert">Revert</button>
    <button id="save" class="primary" data-i18n="save">Save</button>
  </footer>

<script>
  // The shell injects the live theme here before this script runs.
  const INITIAL = window.__DSH_INITIAL__ || {};

  // Strings for both languages the shell speaks. Held here, then applied to the
  // document, so the window is readable the moment it opens.
  const MESSAGES = {
    en: {
      title: 'DSH Shell Settings',
      subtitle: "Stored in DSH's settings.yaml under the dsh-shell namespace, and applied immediately — no restart. Light/dark follows DSH's own Appearance setting.",
      keyboard: 'Keyboard',
      summon: 'Summon shortcut',
      summonHint: 'At least one modifier is required. A combination another app owns is rejected and the current shortcut is kept.',
      colours: 'Colours',
      light: 'Light',
      dark: 'Dark',
      customCss: 'Custom CSS',
      cssHint: 'Appended after the generated rules, so it wins.',
      updates: 'Updates',
      channel: 'Release channel',
      channelLatest: 'Stable (latest tag)',
      channelAlpha: 'Alpha (alpha tag)',
      channelHint: 'Save the new channel before checking. Nothing is installed unless you click Upgrade.',
      installed: 'Installed',
      checkNow: 'Check Now',
      installUpdate: 'Upgrade DSH',
      updateChecking: 'Checking…',
      updateWorking: 'Downloading and verifying… this takes a few seconds.',
      updateCurrent: 'Up to date.',
      updateAvailable: 'Version {target} is available.',
      updateApplied: 'Upgraded to {target}. Restarting the host — this window may reload.',
      updateFailed: 'Update failed',
      updateUnknown: 'Not checked yet.',
      save: 'Save',
      revert: 'Revert',
      saving: 'Saving…',
      saved: 'Saved. Applied immediately.',
      saveFailed: 'Save failed',
      reverted: 'Reverted to the values loaded from disk.',
      noIpc: 'No IPC bridge available',
      hostDown: 'The DSH host is not connected — saving is unavailable.',
      noHostTitle: 'The DSH host is not connected',
      surfaceHover: 'Surface hover',
      textMuted: 'Muted text',
      background: 'Background',
      surface: 'Surface',
      border: 'Border',
      text: 'Text',
      accent: 'Accent',
    },
    zh: {
      title: 'DSH Shell 设置',
      subtitle: '保存在 DSH 的 settings.yaml 中 dsh-shell 命名空间下，修改后立即生效，无需重启。亮/暗色跟随 DSH 自身的外观设置。',
      keyboard: '键盘',
      summon: '唤起快捷键',
      summonHint: '至少需要一个修饰键。若组合已被其他应用占用，会拒绝并保留当前快捷键。',
      colours: '颜色',
      light: '亮色',
      dark: '暗色',
      customCss: '自定义 CSS',
      cssHint: '追加在生成规则之后，因此优先级最高。',
      updates: '更新',
      channel: '发布通道',
      channelLatest: '稳定版（latest 标签）',
      channelAlpha: 'Alpha 版（alpha 标签）',
      channelHint: '切换通道后请先保存再检查。除非你点击升级，否则不会安装任何东西。',
      installed: '当前版本',
      checkNow: '检查更新',
      installUpdate: '升级 DSH',
      updateChecking: '检查中…',
      updateWorking: '正在下载并验证…需要几秒。',
      updateCurrent: '已是最新版本。',
      updateAvailable: '发现新版本 {target}。',
      updateApplied: '已升级到 {target}，正在重启 host —— 此窗口可能会重新加载。',
      updateFailed: '更新失败',
      updateUnknown: '尚未检查。',
      save: '保存',
      revert: '还原',
      saving: '保存中…',
      saved: '已保存，立即生效。',
      saveFailed: '保存失败',
      reverted: '已还原为从磁盘读取的值。',
      noIpc: 'IPC 桥不可用',
      hostDown: 'DSH host 未连接 — 无法保存。',
      noHostTitle: 'DSH host 未连接',
      surfaceHover: '悬停表面',
      textMuted: '次要文字',
      background: '背景',
      surface: '表面',
      border: '边框',
      text: '文字',
      accent: '强调色',
    },
  };
  let LANG = window.__DSH_LOCALE__ || 'en';
  /**
   * Look up a string, substituting `{name}` placeholders.
   *
   * Placeholders rather than concatenation so a translation can put the value
   * where its own grammar wants it — the version is not in the same position in
   * both languages.
   */
  const t = (key, values) => {
    let text = (MESSAGES[LANG] || MESSAGES.en)[key] || key;
    if (values) {
      for (const [name, value] of Object.entries(values)) {
        text = text.split('{' + name + '}').join(value);
      }
    }
    return text;
  };

  /** Apply the strings to the static parts of the document. */
  function applyStrings() {
    document.documentElement.lang = LANG;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      const value = t(key);
      if (value) el.textContent = value;
    });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => {
      const value = t(el.getAttribute('data-i18n-title'));
      if (value) el.title = value;
    });
  }
  // Writes go through the DSH host, so without one a save cannot succeed.
  let hostConnected = window.__DSH_HOST_CONNECTED__ || false;

  // Labels for the palette fields. The *keys* are derived from the data the
  // shell sends, never hardcoded: hardcoding them once meant a renamed field
  // was silently dropped from the saved config and fell back to a default,
  // producing a half-wrong palette with no error anywhere.
  const COLOUR_LABEL_KEYS = {
    background: 'background',
    surface: 'surface',
    surfaceHover: 'surfaceHover',
    border: 'border',
    text: 'text',
    textMuted: 'textMuted',
    accent: 'accent',
  };

  /** The palette field names actually present in the received theme. */
  function colourKeys(palette) {
    const keys = Object.keys(palette || {});
    return keys.length > 0 ? keys : Object.keys(COLOUR_LABEL_KEYS);
  }

  const labelFor = (key) => {
    const dictKey = COLOUR_LABEL_KEYS[key];
    return (dictKey && t(dictKey)) || key;
  };

  const el = (id) => document.getElementById(id);
  const msg = el('msg');

  /** Build the colour rows for one palette. */
  function buildPalette(name, palette) {
    const grid = el(`${name}-grid`);
    grid.innerHTML = '';
    for (const key of colourKeys(palette)) {
      const label = labelFor(key);
      const wrap = document.createElement('div');
      wrap.className = 'swatch';
      wrap.style.padding = '6px 0';

      const text = document.createElement('label');
      text.textContent = label || key;

      const input = document.createElement('input');
      input.type = 'color';
      input.id = `${name}_${key}`;

      const code = document.createElement('code');
      code.id = `${name}_${key}_code`;

      input.addEventListener('input', () => {
        code.textContent = input.value;
      });

      wrap.append(text, input, code);
      grid.append(wrap);
    }
  }

  // Built once the theme is known, so the rows reflect real field names.


  /** Show the given theme in the form. */
  function load(theme) {
    // Rebuild the colour rows from the received object so the field names
    // always match what the shell will accept back.
    buildPalette('light', theme.light);
    buildPalette('dark', theme.dark);
    el('hotkey').value = theme.hotkey || 'meta+shift+D';
    el('custom_css').value = theme.custom_css || '';
    el('update_channel').value = theme.updateChannel || 'latest';

    for (const name of ['light', 'dark']) {
      const palette = theme[name] || {};
      for (const key of colourKeys(palette)) {
        const value = palette[key] || '#888888';
        const input = el(`${name}_${key}`);
        if (!input) continue;
        input.value = value;
        el(`${name}_${key}_code`).textContent = value;
      }
    }
  }

  /** Collect the form into a theme document. */
  function collect() {
    const palette = (name) => {
      const out = {};
      // Read back whatever rows were built, so the payload always carries the
      // same field names the shell sent.
      for (const key of colourKeys(INITIAL[name])) {
        const input = el(`${name}_${key}`);
        if (input) out[key] = input.value;
      }
      return out;
    };
    return {
      hotkey: el('hotkey').value.trim(),
      light: palette('light'),
      dark: palette('dark'),
      customCss: el('custom_css').value,
      // Saved with everything else rather than sent with the check, so the
      // channel in the document and the channel being checked cannot disagree.
      updateChannel: el('update_channel').value,
    };
  }

  function setMessage(text, kind) {
    msg.textContent = text;
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  /** Reflect whether a save is currently possible. */
  function refreshSaveState() {
    const save = el('save');
    if (hostConnected) {
      save.disabled = false;
      save.title = '';
    } else {
      save.disabled = true;
      save.title = t('noHostTitle');
    }
  }

  el('save').addEventListener('click', () => {
    el('save').disabled = true;
    setMessage(t('saving'));
    const config = collect();
    if (window.ipc && window.ipc.postMessage) {
      window.ipc.postMessage(JSON.stringify({ action: 'save', config }));
    } else {
      setMessage(t('noIpc'), 'err');
      el('save').disabled = false;
    }
  });

  el('revert').addEventListener('click', () => {
    load(INITIAL);
    setMessage(t('reverted'));
  });

  // Called by the shell after a save attempt.
  window.__dshSettings = {
    saved(ok, error) {
      refreshSaveState();
      if (ok) {
        setMessage(t('saved'), 'ok');
        // The shell also pushes the newly-written theme back, so the form shows
        // exactly what was persisted rather than what was typed.
      } else {
        setMessage(error || t('saveFailed'), 'err');
      }
    },
    // The shell pushes the live theme whenever it reloads, so an external edit
    // to the document is reflected here too.
    update(theme) {
      load(theme);
    },
    // A pushed theme implies a live host, so a connection recovers the button.
    setConnected(connected) {
      hostConnected = !!connected;
      refreshSaveState();
    },
  };

  // --- Updates ---------------------------------------------------------------
  //
  // The shell owns every decision here: it knows the launcher it runs, checks
  // the registry, and does the install. This page renders a status object and
  // sends back two verbs.

  let updateStatus = window.__DSH_UPDATE__ || { phase: 'unknown' };
  const statusEl = el('update_status');

  /** Ask the shell to do something about updates. */
  function postUpdate(action) {
    if (window.ipc && window.ipc.postMessage) {
      window.ipc.postMessage(JSON.stringify({ action }));
    } else {
      statusEl.textContent = t('noIpc');
      statusEl.className = 'hint err';
    }
  }

  const setStatus = (text, kind) => {
    statusEl.textContent = text;
    statusEl.className = 'hint' + (kind ? ' ' + kind : '');
  };

  /** Render a status object from the shell. */
  function renderUpdate(status) {
    updateStatus = status || { phase: 'unknown' };
    const phase = updateStatus.phase || 'unknown';
    const busy = !!updateStatus.busy;

    el('current_version').textContent = updateStatus.current || '—';
    const hasTarget = !!updateStatus.target;
    const showTarget = hasTarget && (phase === 'available' || phase === 'restartRequired');
    el('update_arrow').hidden = !showTarget;
    if (showTarget) el('target_version').textContent = updateStatus.target;

    // The install button appears only when there is something to install, so it
    // can never be the thing that installs an unreviewed version by accident.
    const install = el('install_update');
    install.hidden = phase !== 'available';
    install.disabled = busy || !hostConnected;
    el('check_update').disabled = busy;

    if (phase === 'checking') setStatus(t('updateChecking'), 'busy');
    else if (phase === 'working') setStatus(t('updateWorking'), 'busy');
    else if (phase === 'current') setStatus(t('updateCurrent'), 'ok');
    else if (phase === 'available') setStatus(t('updateAvailable', { target: updateStatus.target }), 'ok');
    else if (phase === 'restartRequired') setStatus(t('updateApplied', { target: updateStatus.target }), 'ok');
    else if (phase === 'failed' || phase === 'unsupported') {
      // A failure reason comes from the shell and is shown verbatim: it is the
      // only actionable part.
      setStatus((updateStatus.message || t('updateFailed')), 'err');
    } else {
      setStatus(t('updateUnknown'));
    }
  }

  el('check_update').addEventListener('click', () => {
    renderUpdate({ ...updateStatus, phase: 'checking', busy: true });
    postUpdate('checkUpdate');
  });

  el('install_update').addEventListener('click', () => {
    renderUpdate({ ...updateStatus, phase: 'working', busy: true });
    postUpdate('installUpdate');
  });

  window.__dshUpdate = {
    set(status) {
      renderUpdate(status);
    },
  };

  // Strings first, so the static chrome is localised before anything renders.
  applyStrings();
  load(INITIAL);
  refreshSaveState();
  renderUpdate(updateStatus);
  if (!hostConnected) {
    setMessage(t('hostDown'), 'err');
  }
</script>
</body>
</html>
